<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00000" />
    <meta name="description" content="AgriMind – AI-powered crop recommendation system that helps farmers choose the best crops based on soil, weather, and regional data." />
    <meta name="keywords" content="crop recommendation, agriculture, AI, farming, soil analysis, weather, machine learning, agtech" />
    <meta name="author" content="AgriMind Team" />

    <!-- Favicon (emoji version) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>">

    <!-- Open Graph -->
    <meta property="og:title" content="AgriMind - Smart Crop Recommendation" />
    <meta property="og:description" content="AI-driven crop insights for smarter, more sustainable farming." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://agrimind.example.com" />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AgriMind" />
    <meta name="twitter:description" content="AI-powered crop suggestions for modern agriculture." />
    <meta name="twitter:image" content="%PUBLIC_URL%/twitter-image.png" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <title>AgriMind – AI-Powered Crop Recommendation</title>

    <style>
      body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        background-color: #f5f7fa;
      }

      .app-loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: linear-gradient(135deg, #4CAF50 0%, #81C784 100%);
        color: white;
        font-weight: 500;
        font-size: 1.1rem;
      }

      .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid #ffffff;
        border-top: 4px solid transparent;
        border-radius: 50%;
        margin-bottom: 20px;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body>
    <noscript>
      <div style="padding: 20px; text-align: center; background: #f8d7da; color: #721c24;">
        <h2>JavaScript Required</h2>
        <p>Please enable JavaScript in your browser to use AgriMind.</p>
      </div>
    </noscript>

    <div id="loading" class="app-loading">
      <div>
        <div class="spinner"></div>
        Loading AgriMind...
      </div>
    </div>

    <div id="root"></div>

    <script>
      // Register service worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('%PUBLIC_URL%/sw.js')
            .then(reg => console.log('Service Worker registered:', reg))
            .catch(err => console.warn('Service Worker registration failed:', err));
        });
      }

      // Hide loading screen when ready
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.getElementById('loading');
          if (loader) loader.style.display = 'none';
        }, 800);
      });
    </script>
  </body>
</html>
